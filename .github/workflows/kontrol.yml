
name: IPTV Otomatik Link Yenileme

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Dosyalari indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kanal linklerini kontrol et ve yenile
        run: python update.py

      - name: Degisiklikleri GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turk-tv.m3u
          if ! git diff --cached --quiet; then
            git commit -m "IPTV kanal listesi otomatik guncellendi"
            git push
          fi

